name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests, store contract against real Postgres/pgvector (Testcontainers),
      # API tests, and the retrieval quality gate over eval/golden-set.json.
      - name: Build and test
        run: ./mvnw -B verify
      - name: Publish evaluation report
        if: always()
        run: |
          if [ -f target/eval-report.md ]; then cat target/eval-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            target/eval-report.md
            target/surefire-reports/

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - name: Build container image
        run: docker build -t grounded-rag:ci .
